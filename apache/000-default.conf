# Render-compatible default vhost for the quiz PHP API.
# Binds to Render's $PORT. The Listen directive lives ONLY in ports.conf
# (also port-substituted by the entrypoint). Defining Listen here TOO caused
# "Cannot define multiple Listeners on the same IP:port" because ports.conf
# is also loaded and resolves to the same $PORT.

<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Logs are symlinked to stdout/stderr for Render log capture.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Allow .htaccess overrides (Options -Indexes, Require all denied).
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Protect non-API backend folders from direct HTTP access.
    # (These were formally in .htaccess as <Directory> blocks, which Apache
    # does not permit inside .htaccess — that caused HTTP 500. Moved here to
    # server/vhost scope where <Directory> is legal.)
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/helpers>
        Require all denied
    </Directory>

    <Directory /var/www/html/database>
        Require all denied
    </Directory>
</VirtualHost>
