# ============================================================
# Render Blueprint — Capstone Mobile Quiz System (Web Service)
#
# IMPORTANT (verified Render behavior):
# - Render has NO native PHP runtime; PHP MUST be deployed via Docker.
#   This service uses runtime "docker" and the Dockerfile in this folder.
# - Render does NOT offer a managed MySQL service in Blueprints and its
#   FREE plan has no private networking. The app requires MySQL.
#   DECISION: MySQL is hosted EXTERNALLY on Aiven's free/Dev tier
#   (aiven.io). Render talks to it over the internet using its public
#   SSL connection string. This keeps the whole stack at $0 on Render.
#
# This file is OPTIONAL infrastructure-as-code. You can also create the
# Web Service manually by pointing Render at this deploy/ folder with
# runtime = Docker. See the Phase 6 guide for manual steps.
# ============================================================

services:
  - type: web
    name: quiz-system-api
    runtime: docker
    rootDir: .
    plan: free
    envVars:
      # Set these as SECRETS in the Render dashboard (never commit values).
      # They must point at your Aiven MySQL instance:
      #   DB_HOST     -> Aiven host (e.g. mysql-xxxx.aivencloud.com)
      #   DB_PORT     -> Aiven port (e.g. 11025)
      #   DB_NAME     -> the quiz_system database
      #   DB_USER     -> the Aiven service user
      #   DB_PASSWORD -> the Aiven service password
      #   DB_SSL_CA_B64 -> base64 of Aiven's ca.pem (VERY long single-line
      #                    value). Aiven requires TLS; without this the PDO
      #                    connection is refused.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: quiz_system
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_B64
        sync: false
      # Pin the panel's server-to-server API destination in production. If
      # omitted, bootstrap.php falls back to Render's service origin/local
      # request host for development compatibility.
      - key: ADMIN_API_BASE
        sync: false
      # Health check target (returned by the root endpoint).
      - key: APP_ENV
        value: production
      # Render Free blocks outbound SMTP. Use EmailJS over HTTPS in production.
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      # Optional separate templates; otherwise EMAILJS_TEMPLATE_ID is reused.
      - key: EMAILJS_VERIFICATION_TEMPLATE_ID
        sync: false
      - key: EMAILJS_RESET_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      # SMTP remains available for local development or a paid Render service.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: RMC Quiz & Exam System
